name: Self Review

# Demonstrates the tool on its own source. Requires OPENROUTER_API_KEY in
# repository secrets. Skips cleanly when the secret is absent so forks are not
# broken by a missing secret.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review changed files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Review changed files
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY not configured; skipping."
            exit 0
          fi

          BASE=$(git merge-base origin/main HEAD)
          git diff --name-only --diff-filter=ACM "$BASE" HEAD \
            -- '*.py' | tee changed.txt

          report=review.md
          echo "# AI Pair Engineer report" > "$report"
          echo >> "$report"

          # `--fail-on never` so a finding annotates the PR instead of failing
          # a run whose only job is to report.
          while read -r file; do
            [ -z "$file" ] && continue
            {
              echo
              echo "## $file"
              echo
              echo '```'
              pair-engineer "$file" --format markdown --fail-on never --no-color
              echo '```'
            } >> "$report"
          < changed.txt

          cat "$report"

      - name: Comment on the pull request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review.md')) {
              core.info('No report produced.');
              return;
            }
            const body = fs.readFileSync('review.md', 'utf8');
            if (body.trim().length < 100) {
              core.info('Report too short to post.');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- ai-pair-engineer -->';
            const comment = `${marker}\n${body}`;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: comment,
              });
            }
