[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pair-engineer"
version = "1.0.0"
description = "Multi-stage AI pre-review pipeline: analyze, test, refactor, adversarially verify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-review", "static-analysis", "llm", "developer-tools", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pair-engineer = "ai_pair_engineer.cli:main"

[project.urls]
Homepage = "https://github.com/AwonAziz/AI-Pair-Engineer"
Issues = "https://github.com/AwonAziz/AI-Pair-Engineer/issues"

# `benchmarks/` deliberately sits outside src/ and is not part of the wheel.
# It is a development tool for this repository and ships alongside the corpus it
# measures, so it runs from a clone as `python -m benchmarks`.
[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_pair_engineer*"]

[tool.setuptools.package-data]
ai_pair_engineer = ["prompts/*.txt"]

[tool.coverage.run]
branch = true
source = ["ai_pair_engineer", "benchmarks"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `benchmarks/` lives at the repo root rather than under src/, so it is not
# installed and is not on sys.path by default. Without this the benchmark tests
# import only under `python -m pytest` (which happens to add the cwd) and fail
# under a bare `pytest`, which is what CI and most editors invoke.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # `TestCase` and `TestResult` are shipped schema names, so importing them
    # into a test module looks like an uninitialised test class to pytest.
    # The warning is accurate but harmless here.
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "PTH",       # pathlib
    "TID",       # tidy imports
]
ignore = [
    "ANN401",  # allow `Any` where a precise type is not expressible
    "S101",    # asserts are the point of the test suite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "ANN202", "ANN401"]
# `random.uniform` is used for retry jitter. That is not a cryptographic use:
# jitter only needs to spread retries out, and a CSPRNG would cost entropy for
# no security benefit.
"src/ai_pair_engineer/services/llm.py" = ["S311"]
# `examples/sample.py` is deliberately imperfect sample code for the analyzer
# to find problems in. Linting it would mean fixing the very defects it exists
# to demonstrate.
"examples/*" = ["ALL"]
# Corpus case sources and regression pairs are deliberately defective: bare
# excepts, eval, mutable defaults, interpolated SQL. Linting them would mean
# fixing the exact defects they exist to demonstrate. The harness around them is
# still linted strictly.
"benchmarks/cases/*" = ["ALL"]
"app.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
packages = ["ai_pair_engineer", "benchmarks"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Corpus sources are untyped on purpose. They are review targets, not
# library code, and several would need annotations added to stay realistic.
module = ["benchmarks.cases.*"]
ignore_errors = true
follow_imports = "skip"

